name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(sk-[A-Za-z0-9_-]{32,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|LIVEAVATAR_API_KEY=[^[:space:]]+|OPENAI_API_KEY=[^[:space:]]+)' -- ':!*.md' ':!.env.example' ':!.github/workflows/ci.yml'; then
            echo 'Potential secret found in tracked source.' >&2
            exit 1
          fi
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
